<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latency Measurement</title>
    <link rel="stylesheet" href="../effetune.css">
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <style>
        body {
            background: #1e1e1e;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
        }
        #latency-result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Input to Output Latency Measurement</h1>
    <button id="start-latency-btn">Start Measurement</button>
    <div id="latency-result">Press the button to start.</div>
    <p>The latency display updates every 0.5 seconds using a moving average and includes processing time.</p>
    <script type="module" src="latency.js"></script>
</body>
</html>
